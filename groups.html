<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kelompok Belajar • EDU-HARMONY</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Roboto+Slab:wght@700;800&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<script defer src="js/data.js"></script>
<script defer src="js/common.js"></script>
<script defer src="js/app.js"></script>
</head>
<body data-page="groups" data-auth="required">

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar">
      <div>
        <h1>Kelompok Belajar</h1>
        <p class="muted">Gabung kelompok dan lihat komposisi karakter anggotanya</p>
      </div>
      <div id="userWelcome" class="user-badge"></div>
    </header>

    <section class="card">
      <h3>Buat Kelompok</h3>
      <form id="createGroupForm" class="form-row" novalidate>
        <div class="field grow">
          <label for="groupName">Nama kelompok</label>
          <input id="groupName" maxlength="60" placeholder="mis. Tim Website E-Commerce" required>
        </div>
        <div class="field">
          <label for="groupSize">Kapasitas</label>
          <input id="groupSize" type="number" min="2" max="10" value="4" required>
        </div>
        <button class="btn" type="submit"><i class="fas fa-plus"></i> Buat</button>
      </form>
      <div id="groupMsg" class="form-msg" hidden></div>
    </section>
    <div id="groupsList" class="group-grid"></div>
  </main>
</div>

</body>
</html>
